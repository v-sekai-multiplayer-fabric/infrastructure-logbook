# The one commodity of the spent books. A git timestamp is in seconds, so nothing
# in the books is a conversion anybody has to trust. PLANNED-SECONDS is
# deliberately not here: strict mode validates every posting against this list,
# so a planned amount landing in a spent book is a validation error with exit 1
# rather than a number.
permit-empty-commodity = false

commodities = [
    "SECONDS",
]
